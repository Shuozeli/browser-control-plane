name: Real Browser E2E

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  real-browser-e2e:
    name: Docker E2E (Real CDP Browsers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and run real-browser topology
        run: docker compose -f tests/e2e/docker-compose.real-browser.yml up --build --abort-on-container-exit --exit-code-from e2e-client
      - name: Show logs on failure
        if: failure()
        run: docker compose -f tests/e2e/docker-compose.real-browser.yml logs
      - name: Tear down
        if: always()
        run: docker compose -f tests/e2e/docker-compose.real-browser.yml down
